<div class="min-h-screen bg-gray-50 dark:bg-gray-950 flex transition-colors duration-300 font-sans">
  
  <app-sidebar></app-sidebar>

  <!-- Main Content Wrapper -->
  <main 
    class="flex-1 transition-all duration-300 ease-[cubic-bezier(0.4,0,0.2,1)] flex flex-col min-h-screen relative w-full"
    [ngClass]="{
      'md:ml-72 ml-0': menuService.state() === 'full',
      'md:ml-28 ml-0': menuService.state() === 'compact',
      'ml-0': menuService.state() === 'hide'
    }">
    
    <!-- Topbar -->
    <header class="h-16 flex items-center justify-between px-6 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-100 dark:border-gray-800 sticky top-0 z-30 transition-colors">
        <div class="flex items-center gap-4">
            <button 
                (click)="menuService.toggleState()" 
                class="p-2 -ml-2 rounded-xl text-gray-500 hover:text-gray-900 dark:hover:text-gray-100 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500/50">
                <lucide-icon name="Menu" class="w-6 h-6"></lucide-icon>
            </button>
            <div class="h-8 flex items-center">
              @for (title of titles(); track title) {
                <h1 class="text-xl font-semibold text-gray-800 dark:text-gray-100 hidden sm:block tracking-tight title-animation">
                  {{ title }}
                </h1>
              }
            </div>
        </div>
        
        <div class="flex items-center gap-4">
            <div class="w-9 h-9 rounded-full bg-gradient-to-br from-blue-100 to-blue-200 dark:from-blue-900 dark:to-blue-800 flex items-center justify-center border border-blue-200 dark:border-blue-700 shadow-sm cursor-pointer hover:shadow-md transition-shadow">
                <span class="text-blue-700 dark:text-blue-300 font-bold text-sm">A</span>
            </div>
        </div>
    </header>

    <!-- Page Content -->
    <div class="p-6 flex-1 overflow-y-auto overflow-x-hidden">
      <div class="mx-auto w-full max-w-7xl">
        <router-outlet></router-outlet>
      </div>
    </div>
  </main>

  <!-- Mobile Overlay -->
  @if (menuService.state() === 'full') {
    <div 
      (click)="menuService.setState('hide')"
      class="md:hidden fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-30 transition-opacity">
    </div>
  }
</div>
