<!-- Floating Dynamic Island style Sidebar -->
<aside 
  class="h-[calc(100vh-2rem)] fixed left-4 top-4 bg-white dark:bg-gray-900 rounded-3xl shadow-2xl border border-gray-100 dark:border-gray-800 transition-all duration-300 ease-[cubic-bezier(0.4,0,0.2,1)] z-40 flex flex-col overflow-hidden"
  [ngClass]="{
    'w-64': menuService.state() === 'full',
    'w-20': menuService.state() === 'compact',
    'w-0 opacity-0 -translate-x-full': menuService.state() === 'hide'
  }">
  
  <!-- Header / Brand -->
  <div class="h-16 flex items-center justify-between px-4 mt-2">
    @if (menuService.state() === 'full') {
      <div class="flex items-center gap-3 overflow-hidden whitespace-nowrap">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center flex-shrink-0 shadow-lg shadow-blue-500/30">
          <span class="text-white font-bold text-lg">B</span>
        </div>
        <span class="font-bold text-xl tracking-tight text-gray-900 dark:text-white">BillSoft</span>
      </div>
    }

    @if (menuService.state() === 'compact') {
      <div class="flex items-center justify-center w-full">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center flex-shrink-0 shadow-lg cursor-pointer hover:shadow-blue-500/40 transition-shadow"
             (click)="menuService.setState('full')">
          <span class="text-white font-bold text-lg">B</span>
        </div>
      </div>
    }
  </div>

  <!-- Search Bar (only in full mode) -->
  @if (menuService.state() === 'full') {
    <div class="px-4 pb-4 pt-2">
      <div class="relative group">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <lucide-icon name="Search" class="h-4 w-4 text-gray-400 group-focus-within:text-blue-500 transition-colors"></lucide-icon>
        </div>
        <input 
          type="text" 
          [(ngModel)]="searchTerm" 
          (ngModelChange)="onSearchChange()"
          placeholder="Buscar menú..." 
          class="block w-full pl-10 pr-10 py-2.5 border border-gray-200 dark:border-gray-700 rounded-xl bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-gray-100 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:bg-white dark:focus:bg-gray-900 focus:border-blue-500 transition-all text-sm shadow-inner"
        >
        @if (searchTerm) {
          <button 
            (click)="searchTerm = ''; onSearchChange()" 
            class="absolute inset-y-0 right-0 pr-3 flex items-center">
            <lucide-icon name="X" class="h-4 w-4 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 cursor-pointer transition-colors"></lucide-icon>
          </button>
        }
      </div>
    </div>
  }

  <!-- Navigation Items -->
  <nav class="flex-1 overflow-y-auto overflow-x-hidden scrollbar-thin scrollbar-thumb-gray-200 dark:scrollbar-thumb-gray-700 px-3 py-2 space-y-1">
    @for (item of menuService.items(); track item.id) {
      <app-menu-item [item]="item" [menuState]="menuService.state()"></app-menu-item>
    }
  </nav>

  <!-- Footer / Logout -->
  <div class="p-4 mt-auto border-t border-gray-100 dark:border-gray-800 bg-gray-50/50 dark:bg-gray-800/30">
    <button (click)="logout()" 
        class="flex items-center gap-3 px-3 py-2.5 w-full rounded-xl transition-all duration-200 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 group"
        [class.justify-center]="menuService.state() === 'compact'">
      <lucide-icon name="LogOut" class="w-5 h-5 flex-shrink-0 group-hover:-translate-x-1 transition-transform"></lucide-icon>
      
      @if (menuService.state() === 'full') {
        <span class="font-medium flex-1 text-left text-sm whitespace-nowrap overflow-hidden">Cerrar Sesión</span>
      }
    </button>
  </div>
</aside>
