<div class="max-w-4xl mx-auto space-y-6">
  


  @if (errorMessage()) {
    <div class="p-4 rounded-xl bg-error-light border border-red-200 text-error flex items-center gap-3 animate-fade-in shadow-sm">
      <lucide-icon name="X" class="w-5 h-5 flex-shrink-0"></lucide-icon>
      <span class="font-medium text-sm">{{ errorMessage() }}</span>
    </div>
  }

  @if (successMessage()) {
    <div class="p-4 rounded-xl bg-green-50 border border-green-200 text-green-700 flex items-center gap-3 animate-fade-in shadow-sm">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
      <span class="font-medium text-sm">{{ successMessage() }}</span>
    </div>
  }

  <div class="bg-white dark:bg-gray-900 rounded-[2rem] p-8 shadow-md border border-gray-100 dark:border-gray-800 transition-all">
    <form [formGroup]="mainForm" (ngSubmit)="startProcess()" class="space-y-6">
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <app-input [control]="getControl('rfc')" label="RFC del Contribuyente" placeholder="Ej. ABCD123456XYZ" icon="user"></app-input>
        <app-input [control]="getControl('ciec')" label="Contraseña (CIEC)" type="password" placeholder="••••••••" icon="password"></app-input>
      </div>

      <div class="space-y-2">
        <label class="text-sm font-medium text-text-secondary block">Tipo de Comprobantes</label>
        <app-radio-button [control]="getControl('type')" [options]="invoiceTypes"></app-radio-button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <app-input 
          [control]="getControl('fechaInicial')" 
          label="Fecha Inicial" 
          type="date">
        </app-input>
        
        <app-input 
          [control]="getControl('fechaFinal')" 
          label="Fecha Final" 
          type="date">
        </app-input>
      </div>

      <div class="pt-4 flex justify-end">
        <app-button type="submit" [loading]="isLoading()" variant="primary" label="Conectar y Solicitar">
          <lucide-icon name="Search" class="w-4 h-4"></lucide-icon>
        </app-button>
      </div>
    </form>
  </div>
</div>

<app-modal [isOpen]="isModalOpen()" title="Verificación de Seguridad SAT" (onClose)="closeModal()">
  <form [formGroup]="captchaForm" (ngSubmit)="submitCaptcha()" class="space-y-6">
    
    <div class="flex items-center justify-between bg-orange-50 dark:bg-orange-900/20 border border-orange-100 dark:border-orange-800/30 rounded-xl p-4">
      <div class="flex items-center gap-3">
        <div class="w-2 h-2 rounded-full bg-orange-500 animate-pulse"></div>
        <span class="text-sm font-medium text-orange-800 dark:text-orange-400">Tiempo restante de la sesión</span>
      </div>
      <span class="font-mono font-bold text-lg text-orange-600 dark:text-orange-300">{{ formattedTime() }}</span>
    </div>

    <div class="bg-gray-50 dark:bg-gray-800/50 rounded-xl border border-gray-200 dark:border-gray-700 p-4 flex flex-col items-center justify-center gap-3 min-h-[120px]">
      @if (captchaImage()) {
        <img [src]="captchaImage()" alt="SAT Captcha" class="rounded-lg shadow-sm bg-white p-2 border border-gray-200 select-none pointer-events-none">
      } @else {
        <div class="w-6 h-6 border-2 border-primary border-t-transparent rounded-full animate-spin"></div>
      }
    </div>

    <app-input [control]="getCaptchaControl('captchaText')" label="Ingrese los caracteres de la imagen" placeholder="ABCD" [type]="'text'"></app-input>

    <div class="pt-2">
      <app-button [fullWidth]="true" type="submit" [loading]="isLoading()" variant="primary" label="Continuar Descarga">
        <lucide-icon name="ChevronRight" class="w-4 h-4"></lucide-icon>
      </app-button>
    </div>
  </form>
</app-modal>
