<button [type]="type()" [class]="'btn btn-' + variant() + ' btn-' + size()" [class.full-width]="fullWidth()"
    [disabled]="disabled() || loading()" (click)="handleClick($event)">
    <div class="btn-content" [class.invisible]="loading()">
        <ng-content></ng-content>
        @if (label()) {
            <span>{{ label() }}</span>
        }
    </div>

    <div class="loader-container" *ngIf="loading()">
        <div class="spinner"></div>
    </div>
</button>
